name: Subspace
description: >-
  Subspace was a real-time network-as-a-service platform delivering a dedicated,
  performance-optimized global network for latency-sensitive applications —
  WebRTC, VoIP/SIP calling, video conferencing, multiplayer gaming, and fintech.
  Its Product API provisions three services: PacketAccelerator (no-code global
  internet acceleration), SIPTeleport (SIP/VoIP call-quality improvement), and
  WebRTC-CDN (instant global WebRTC acceleration with ICE server configuration).
  The REST API uses resource-oriented URLs and JSON responses, versioned at v1,
  authenticated with OAuth2 client-credentials issuing 24-hour JWT bearer tokens
  via Auth0, and ships six first-party OpenAPI client SDKs. The company was a
  Bloomberg Beta portfolio company; its marketing site remains live while the
  API, identity, and status hosts have wound down operationally.
